name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# `check` is the single required status. It passes only if static + e2e both passed.
jobs:
  static:
    name: Backlog, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/check-backlog.mjs
      - run: npm run lint
      - run: npm test
      - run: npx vite build
      - name: Bundle budget (main JS ≤ 120 kB gzip)
        run: |
          f=$(ls dist/metaphases/assets/index-*.js); g=$(gzip -c "$f" | wc -c); echo "main.js gzip: $g bytes"
          [ "$g" -le 122880 ] || { echo "::error::main bundle $g B gzip exceeds the 120 kB budget (AGENTS.md)"; exit 1; }

  e2e:
    name: e2e (desktop + phone, recorded fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install chromium || npx playwright install --with-deps chromium
      - run: npx vite build
      - run: npx playwright test
        env: { CI: "1" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: "playwright-report\ntest-results", retention-days: 7 }

  check:
    name: check
    if: always()
    needs: [static, e2e]
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.static.result }}" = success ] && [ "${{ needs.e2e.result }}" = success ]'
