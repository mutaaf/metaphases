name: Data refresh
# Weekly: rebuild the ticker universe (S&P 500 membership, names, logos, market caps) and the
# ETF top-holdings snapshot, then open a keep/ PR. PRs opened with GITHUB_TOKEN don't trigger
# other workflows, so this job arms auto-merge and dispatches CI on the branch itself.
on:
  schedule:
    - cron: '20 9 * * 0'   # Sundays 09:20 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Respect the operator's pause switch
        run: |
          if [ "$(jq -r .paused agents/control.json)" = "true" ]; then echo "paused"; echo "PAUSED=1" >> "$GITHUB_ENV"; fi
      - if: env.PAUSED != '1'
        run: pip install yfinance
      - if: env.PAUSED != '1'
        run: python3 scripts/build_universe.py --fresh
      - if: env.PAUSED != '1'
        run: python3 scripts/refresh_etfs.py
      - name: Open PR if data changed
        if: env.PAUSED != '1'
        run: |
          git diff --quiet -- data/ && { echo "no changes"; exit 0; }
          b="keep/data-refresh-$(date -u +%Y%m%d)"
          git config user.name "metaphases-bot"; git config user.email "actions@github.com"
          git checkout -b "$b"; git add data/universe.json data/etf_holdings.json data/sp500.csv
          n=$(jq 'length' data/universe.json)
          git commit -m "keep: weekly data refresh ($n tickers, ETF holdings $(date -u +%F))"
          git push -u origin "$b"
          pr=$(gh pr create --base main --head "$b" --title "keep: weekly data refresh ($(date -u +%F))" \
            --body "Automated weekly refresh: S&P 500 membership, company profiles/market caps ($n tickers) and ETF top-10 holdings. Generated by .github/workflows/data-refresh.yml.")
          gh pr merge "$pr" --auto --squash --delete-branch || true
          gh workflow run ci.yml --ref "$b"
