<!doctype html><html><head>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Martian+Mono:wght@400;500&family=Schibsted+Grotesk:wght@800;900&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#edeae2;color:#111114;font-family:"Schibsted Grotesk";position:relative;
background-image:radial-gradient(circle at 1px 1px,rgba(17,17,20,.09) 1px,transparent 0);background-size:22px 22px}
.frame{position:absolute;inset:28px;border:1.5px solid #111114;display:grid;grid-template-columns:1.05fr 1fr}
.l{padding:44px 48px;display:flex;flex-direction:column;justify-content:space-between;border-right:1.5px solid #111114}
.brand{display:flex;align-items:center;gap:14px;font:500 17px "Martian Mono";letter-spacing:.24em}
h1{font-weight:900;font-size:74px;line-height:.93;letter-spacing:-.05em;margin:0}
h1 em{font:italic 400 1.14em/.8 "Instrument Serif";color:#2346d8;letter-spacing:-.02em}
.sub{font-size:21px;line-height:1.4;color:#3b3a37;max-width:460px;margin-top:20px;font-weight:800;letter-spacing:-.01em}
.url{font:500 15px "Martian Mono";letter-spacing:.2em;color:#2346d8}
.r{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:auto repeat(4,1fr);background:#f5f3ee}
.wd{padding:16px 0 12px 14px;border-bottom:1.5px solid #111114}
.wd span{font:500 12px "Martian Mono";letter-spacing:.14em;color:#fff;padding:3px 7px}
.c{border-right:1px solid #d6d1c5;border-bottom:1px solid #d6d1c5;padding:12px 10px 0 14px;display:flex;flex-direction:column;gap:9px}
.c:nth-child(5n){border-right:0}
.d{font:400 11px "Martian Mono";letter-spacing:.12em;color:#7d796f}
.m{display:flex;gap:6px}
.next{background:#111114}.next .d{color:#edeae2}
</style></head><body>
<div class="frame">
 <div class="l">
  <div class="brand"><svg width="30" height="30" viewBox="0 0 32 32"><circle cx="16" cy="16" r="12.5" fill="none" stroke="#2346d8" stroke-width="2.6"/><path d="M16 3.5a12.5 12.5 0 0 1 0 25a7.6 12.5 0 0 1 0-25z" fill="#2346d8"/></svg>METAPHASES</div>
  <div><h1>Every earnings report, <em>phase by phase.</em></h1>
  <div class="sub">Who reports, when, how they’ve moved before — and how much of your money rides on it.</div></div>
  <div class="url">METAPHASES.COM</div>
 </div>
 <div class="r" id="r"></div>
</div>
<script>
const wd=[["MON","#2b59e0"],["TUE","#e0533a"],["WED","#8a3fe0"],["THU","#e09a1f"],["FRI","#2c9a5c"]];
const r=document.getElementById("r");
wd.forEach(([w,c])=>r.insertAdjacentHTML("beforeend",`<div class="wd"><span style="background:${c}">${w}</span></div>`));
const ph=(h,col)=>{const k="M6 .8a5.2 5.2 0 0 1 0 10.4";let p="";if(h==="b")p=`<path d="M6 .8a5.2 5.2 0 0 1 0 10.4a2.6 5.2 0 0 0 0-10.4z" fill="${col}"/>`;if(h==="a")p=`<path d="M6 .8a5.2 5.2 0 0 0 0 10.4a2.6 5.2 0 0 1 0-10.4z" fill="${col}"/>`;if(h==="d")p=`<circle cx="6" cy="6" r="5.2" fill="${col}"/>`;return `<svg width="26" height="26" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5.2" fill="none" stroke="${col}" stroke-width="1.1"/>${p}</svg>`};
const pat="bab ad bba a ab dab bb aba b ba abd ab bab a bb aab ba d bab ab".split(" ");
for(let i=0;i<20;i++){const n=i===6;const col=n?"#7d97ff":"#2346d8";const day=String(2+Math.floor(i/5)*7+i%5).padStart(2,"0");
r.insertAdjacentHTML("beforeend",`<div class="c ${n?"next":""}"><span class="d">NOV ${day}</span><div class="m">${[...pat[i]].map(h=>ph(h,col)).join("")}</div></div>`)}
</script></body></html>
