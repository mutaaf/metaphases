<!doctype html><html><head>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Martian+Mono:wght@400;500&family=Schibsted+Grotesk:wght@500;700;900&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden}

<div>
 <div class="eyebrow">METAPHASES KIDS</div>
